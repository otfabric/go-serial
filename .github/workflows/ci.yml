# Called by pr.yml on every pull request that is not documentation only;
# dispatch it to run it on a branch without a pull request.
name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v3.8.0
    with:
      # otfabric-policy runs in docs.yml, on every pull request and push to main.
      run-policy: false
      run-govulncheck: true
      coverage-min: "90"
      fuzz-time: 10s
      codecov-name: go-serial
      go-versions: '["1.26", "1.27"]'
    secrets: inherit

  cross-build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm && format('/v{0}', matrix.goarm) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm
            goarm: "7"
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: freebsd
            goarch: amd64
          - goos: freebsd
            goarch: arm64
          - goos: netbsd
            goarch: amd64
          - goos: openbsd
            goarch: amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: go build ./...
      # go build skips the test files. go vet compiles them for the target,
      # so the tests of a backend that no job runs still have to build.
      - name: Vet
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: go vet ./...

  # Per-package coverage floor (TEST-012): the shared workflow gates the
  # total, this job gates each package.
  coverage-floor:
    name: Per-package coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make coverage-pkg-check

  # A runner has a PTY: SERIAL_REQUIRE_PTY=1 turns a missing one into a
  # failure, so the real-tty tests cannot pass as skips.
  pty:
    name: PTY tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test-pty

  # A runner has no serial port, so no test opens one. This runs what needs
  # none on Windows: the time-out and DCB conversions, the Write loop on a
  # replaced WriteFile, and the tests without a build constraint.
  windows:
    name: Tests (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...
