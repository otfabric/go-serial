name: Release
run-name: Release (${{ inputs.bump }}) from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

jobs:
  release:
    uses: otfabric/.github/.github/workflows/go-package-release.yml@v3.8.0
    with:
      bump: ${{ inputs.bump }}
      release-name-prefix: go-serial
      update-major-tag: false
      # A module that requires go-serial directly: built, vetted and tested
      # against the release commit before the tag is created. go-canbus also
      # requires it but is not listed: its SocketCAN tests need a kernel with
      # AF_CAN, which this job does not set up.
      consumers: |
        otfabric/go-modbus
    secrets: inherit
